<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nitish &amp; Tanya — Wedding Invitation</title>
    <meta name="description" content="Together with their families, Nitish Dhiman and Tanya Sharma invite you to celebrate their wedding on 21 November 2026 at Master Farm Resort, Zirakpur." />
    <meta property="og:title" content="Nitish &amp; Tanya — Wedding Invitation" />
    <meta property="og:description" content="21 November 2026 · Master Farm Resort, Zirakpur" />
    <meta property="og:image" content="./editable/assets/events.jpg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <script src="./editable/wedding-data.js"></script>
    <script type="module" crossorigin src="./assets/index-cdc8IQTD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/styles-xl0qPzWF.css">
    <style>
      /* Luxury floating background music player */
      .music-player-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 99999;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(6, 44, 38, 0.85);
        border: 1.5px solid rgba(223, 177, 65, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), 0 0 15px rgba(223, 177, 65, 0.3);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        outline: none;
        padding: 0;
      }
      .music-player-btn:hover {
        transform: scale(1.08);
        border-color: rgba(223, 177, 65, 1);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5), 0 0 20px rgba(223, 177, 65, 0.5);
      }
      .music-player-btn:active {
        transform: scale(0.94);
      }
      .music-bars {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 18px;
      }
      .music-bars .bar {
        width: 2.5px;
        background: #dfb141;
        border-radius: 2px;
        height: 5px;
        transition: height 0.25s ease, opacity 0.25s ease;
      }
      .music-player-btn.playing .bar-1 {
        animation: audioWave1 1.1s ease-in-out infinite alternate;
      }
      .music-player-btn.playing .bar-2 {
        animation: audioWave2 0.85s ease-in-out infinite alternate;
      }
      .music-player-btn.playing .bar-3 {
        animation: audioWave3 1.25s ease-in-out infinite alternate;
      }
      .music-player-btn.playing .bar-4 {
        animation: audioWave4 0.95s ease-in-out infinite alternate;
      }
      @keyframes audioWave1 { 0% { height: 4px; } 100% { height: 16px; } }
      @keyframes audioWave2 { 0% { height: 16px; } 100% { height: 6px; } }
      @keyframes audioWave3 { 0% { height: 6px; } 100% { height: 18px; } }
      /* Fix descender clipping (e.g. 'y' in Tanya) with gold foil gradient */
      .text-gold-foil {
        display: inline-block;
        padding-bottom: 0.24em;
        margin-bottom: -0.20em;
        padding-top: 0.05em;
        margin-top: -0.05em;
        overflow: visible;
      }
      .font-display.text-gold-foil {
        padding-bottom: 0.28em;
        margin-bottom: -0.22em;
      }
    </style>
  </head>
  <body>
    <!-- Background Audio -->
    <audio id="bg-audio" loop preload="auto" src="./editable/assets/bg-music.mp3"></audio>

    <!-- Floating Audio Control -->
    <button id="music-btn" class="music-player-btn" aria-label="Toggle background music" title="Toggle Music">
      <div class="music-bars">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
        <span class="bar bar-4"></span>
      </div>
    </button>

    <div id="root"></div>

    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const btn = document.getElementById('music-btn');
        let isPlaying = false;

        function playMusic() {
          if (!audio) return;
          audio.volume = 0.85;
          const p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              isPlaying = true;
              btn.classList.add('playing');
            }).catch(function(err) {
              console.log('Autoplay deferred:', err);
            });
          }
        }

        function pauseMusic() {
          if (!audio) return;
          audio.pause();
          isPlaying = false;
          btn.classList.remove('playing');
        }

        window.__playMusic = playMusic;

        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (isPlaying) {
            pauseMusic();
          } else {
            playMusic();
          }
        });

        // Auto-play on first user touch/click
        function onFirstInteraction() {
          if (!isPlaying) {
            playMusic();
          }
          document.removeEventListener('click', onFirstInteraction);
          document.removeEventListener('touchstart', onFirstInteraction);
        }
        document.addEventListener('click', onFirstInteraction, { once: true });
        document.addEventListener('touchstart', onFirstInteraction, { once: true });
      })();
    </script>
  </body>
</html>
